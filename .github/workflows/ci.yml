name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy weftgate
      - run: python -m weftgate.selftest
      - run: pytest -q --cov=weftgate --cov-report=term-missing --cov-fail-under=85
      - name: mutation harness (fixture; an upper bound, not a field number)
        run: weftgate eval mutate --fixture --seed 13
      - name: weftgate audits itself
        run: weftgate audit --format=github

  core-only:
    # No optional extras installed: everything heavier than the standard library
    # must degrade to UNVERIFIABLE, never to a false reject, and the stdio MCP
    # server must still serve without the `mcp` package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Confirm optional dependencies are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('mcp', 'tree_sitter', 'pylsp', 'yaml'))"
      - run: python -m weftgate.selftest
      - run: pytest -q
      - run: weftgate audit --format=github

  package:
    # The wheel builds and installs cleanly from scratch, and the console script works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl
      - run: cd / && weftgate --version && python -m weftgate.selftest
