name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all,dev]"
      - run: ruff check .
      - run: mypy weft
      - run: python -m weft.selftest
      - run: pytest -q
      - name: mutation harness (fixture; an upper bound, not a field number)
        run: weft eval mutate --fixture --seed 13

  core-only:
    # No optional extras installed: everything heavier than the standard library
    # must degrade to UNVERIFIABLE, never to a false reject, and the stdio MCP
    # server must still serve without the `mcp` package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -c "import mcp" && exit 1 || echo "mcp extra absent, as intended"
      - run: python -m weft.selftest
      - run: pytest -q
      - run: weft --repo . audit --format=github
