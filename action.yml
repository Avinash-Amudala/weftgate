name: "weftgate"
description: "Verification gate for coding agents: check the wiring (env vars, imports, routes) of a pull request, or audit a whole repo."
author: "Avinash Amudala"
branding:
  icon: "check-square"
  color: "purple"
inputs:
  mode:
    description: "check (the pull request diff against its base) or audit (the whole repo)"
    required: false
    default: "check"
  base:
    description: "Base ref to diff against in check mode (default: the PR base, else HEAD~1)"
    required: false
    default: ""
  paths:
    description: "Space-separated paths to limit an audit to"
    required: false
    default: ""
  block-on:
    description: "reject | review | never (overrides weftgate.toml)"
    required: false
    default: ""
  python-version:
    description: "Python version to run weftgate with"
    required: false
    default: "3.12"
  weftgate-ref:
    description: "Git ref of weftgate to install (default: the ref this action was invoked at)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install weftgate
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.weftgate-ref }}" ]; then
          pip install -q "git+https://github.com/${{ github.action_repository || 'Avinash-Amudala/weftgate' }}@${{ inputs.weftgate-ref }}"
        else
          pip install -q "${{ github.action_path }}"
        fi
        weftgate --version
    - name: Run weftgate
      shell: bash
      env:
        WEFTGATE_BLOCK_ON: ${{ inputs.block-on }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.mode }}" = "audit" ]; then
          weftgate audit --format=github ${{ inputs.paths }}
          exit $?
        fi
        base="${{ inputs.base }}"
        if [ -z "$base" ] && [ -n "${{ github.base_ref }}" ]; then
          base="origin/${{ github.base_ref }}"
          git fetch -q --depth=1 origin "${{ github.base_ref }}" || true
        fi
        if [ -z "$base" ]; then
          base="HEAD~1"
        fi
        echo "weftgate: checking diff $base...HEAD"
        git diff --no-color --no-ext-diff --no-renames -U0 "$base...HEAD" | weftgate check - --format=github
