name: "weftgate"
description: "Verification gate for coding agents: check the wiring (env vars, imports, routes) of a pull request, or audit a whole repo."
author: "Avinash Amudala"
branding:
  icon: "check-square"
  color: "purple"
inputs:
  mode:
    description: "check (the pull request diff against its base) or audit (the whole repo)"
    required: false
    default: "check"
  base:
    description: "Base ref to diff against in check mode (default: the PR base, else HEAD~1)"
    required: false
    default: ""
  paths:
    description: "Shell-quoted paths to limit an audit to (no shell expansion)"
    required: false
    default: ""
  block-on:
    description: "reject | review | never (overrides weftgate.toml)"
    required: false
    default: ""
  python-version:
    description: "Python version to run weftgate with"
    required: false
    default: "3.12"
  weftgate-ref:
    description: "Git ref of weftgate to install (default: the ref this action was invoked at)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install weftgate
      shell: bash
      env:
        INPUT_REF: ${{ inputs.weftgate-ref }}
      run: python "$GITHUB_ACTION_PATH/scripts/action_runner.py" install
    - name: Run weftgate
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PATHS: ${{ inputs.paths }}
        PR_BASE: ${{ github.base_ref }}
        WEFTGATE_BLOCK_ON: ${{ inputs.block-on }}
      run: python "$GITHUB_ACTION_PATH/scripts/action_runner.py"
