[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weft"
version = "0.1.0"
description = "A verification gate for coding agents that checks the wiring, not the spelling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Avinash Amudala" }]
keywords = ["mcp", "coding-agents", "verification", "grounding", "hallucination", "claude-code", "codex", "cursor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
]

# Core stays standard-library only. Nothing here on purpose.
dependencies = []

[project.optional-dependencies]
# Optional accelerators. Each must degrade to UNVERIFIABLE when absent.
treesitter = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.7"]
lsp = ["python-lsp-server>=1.10"]
yaml = ["PyYAML>=6.0"]
mcp = ["mcp>=1.2"]
all = ["weft[treesitter]", "weft[lsp]", "weft[yaml]", "weft[mcp]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
weft = "weft.cli:main"

# Community oracles register under this entry-point group.
[project.entry-points."weft.oracles"]
env_vars = "weft.oracles.env_vars:register"
imports_lockfile = "weft.oracles.imports_lockfile:register"
routes_fastapi = "weft.oracles.routes_fastapi:register"

[tool.hatch.build.targets.wheel]
packages = ["weft"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
