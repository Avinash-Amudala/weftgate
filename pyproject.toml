[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weftgate"
dynamic = ["version"]
description = "A local second brain for coding agents: grounded context, source-aware memory and verification gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Avinash Amudala" }]
keywords = ["mcp", "coding-agents", "verification", "grounding", "hallucination", "claude-code", "codex", "cursor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
]

# Core stays standard-library only. Nothing here on purpose.
dependencies = []

[project.optional-dependencies]
demo = ["Pillow>=10.0", "imageio-ffmpeg>=0.5"]
# Optional accelerators reserved for future oracles. The v0.2 core does not use
# treesitter, lsp or yaml. mcp is used by tests to drive the stdlib server through
# the official client. No extra is needed for context, memory, hooks or serving MCP.
treesitter = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.7"]
lsp = ["python-lsp-server>=1.10"]
yaml = ["PyYAML>=6.0"]
mcp = ["mcp>=1.2"]
all = ["weftgate[treesitter]", "weftgate[lsp]", "weftgate[yaml]", "weftgate[mcp]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
weftgate = "weftgate.cli:main"

# Community oracles register under this entry-point group.
[project.entry-points."weftgate.oracles"]
env_vars = "weftgate.oracles.env_vars:register"
imports_lockfile = "weftgate.oracles.imports_lockfile:register"
routes_fastapi = "weftgate.oracles.routes_fastapi:register"

[project.urls]
Homepage = "https://github.com/Avinash-Amudala/weftgate"
Changelog = "https://github.com/Avinash-Amudala/weftgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/Avinash-Amudala/weftgate/issues"

[tool.hatch.version]
path = "weftgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["weftgate"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/assets/*.mp4", "docs/assets/*.gif"]
include = ["weftgate/", "tests/", "docs/", "scripts/", "README.md", "CHANGELOG.md", "LICENSE",
           "NOTICE", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md", "weftgate.toml",
           ".env.example", "action.yml", ".pre-commit-hooks.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:weftgate.*"]

[tool.coverage.run]
source = ["weftgate"]
omit = ["weftgate/__main__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
# Python only: never rewrite the code samples inside the design documents.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
